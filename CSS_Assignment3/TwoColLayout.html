<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Column Layout</title>
    <style>
        div{
            border:none;
            padding-left:10px;
            background-color: lightgrey;
        }
        .left{
            float:left;
            width:30%;
            height:100px;
        }
        .right{
            float:left;
            width:68%;
            height:100px;
            background-color: grey;
        }
    </style>
</head>
<body>
    <div class="left">
        <p><b>Left Column</b></p>
        <p>This is the sidebar content.</p>
    </div>
    <div class="right">
        <p><b>Main Content</b></p>
        <p>This is the main article content area.</p>
    </div>
</body>
</html>
