<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table using box model</title>
    <style>
        .pricing-box{
            border: 2px solid #4CAF50;
            border-radius: 10px;
            padding: 20px;
            margin: 20px;
            width: 250px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            float: left;
            margin-left: 50px;
        }
        ul{
            list-style-type: none;
            padding: 0;
        }
    </style>
</head>
<body>
      
    <div class="pricing-box">
      <h2>Basic</h2>
      <p class="price">$10/month</p>
      <ul>
        <li>1 User</li>
        <li>5GB Storage</li>
        <li>Email Support</li>
      </ul>
    </div>

    <div class="pricing-box">
      <h2>Standard</h2>
      <p class="price">$20/month</p>
      <ul>
        <li>5 Users</li>
        <li>50GB Storage</li>
        <li>Priority Support</li>
      </ul>
    </div>

    <div class="pricing-box">
      <h2>Premium</h2>
      <p class="price">$30/month</p>
      <ul>
        <li>Unlimited Users</li>
        <li>200GB Storage</li>
        <li>24/7 Support</li>
      </ul>
    </div>
</body>
</html>
