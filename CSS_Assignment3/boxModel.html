<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        /* .content-box will render larger than 200px wide and 50px high due to the added padding and border */
        .content-box{
            width:200px;
            height:50px;
            border: 5px solid black;
            padding-left:15px;
            box-sizing: content-box;
            background-color: lightgrey;
            margin:auto;
            margin-top:30px;
        }
        /* .border-box will maintain its 200px width and 50px height, with the padding and border consuming space inside those dimensions. */
        .border-box{
            box-sizing:border-box;
            width:200px;
            height:50px;
            border: 5px solid black;
            padding-left:15px;
            background-color: lightgrey;
            margin:auto;
            margin-top:30px;
        }
    </style>
</head>
<body>
    <div class="content-box">
        <p><b>Content-box model</b></p>
    </div>
    <div class="border-box">
        <p><b>Border-box model</b></p>
    </div>
</body>
</html>
