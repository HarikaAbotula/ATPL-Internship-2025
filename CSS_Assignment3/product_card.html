<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <style>
        .container{
            border:1px solid grey;
			width: 300px;
			height:180px;
			padding:25px;
			margin:auto;
            border-radius:24px;     
        }
        .product-image{
            display:block;
            margin-left:auto;
            margin-right:auto;
        }
        p{
            text-align:center;
            font-size:20px;
            font-weight:bold;
            margin-top:2px; 
            margin-bottom: 5px; 
        }
        .buynow-button{
            display:block;
            margin-left:auto;
            margin-right:auto;
            background-color:green;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:4px;
            padding:8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="headset.jpeg" alt="Head Phone" class="product-image" width="150px" height="100px">
        <p class="product-title">Head Phone</p>
        <p class="product-price">$29.99</p>
        <button class="buynow-button">Buy Now</button>
    </div>
</body>
</html>
