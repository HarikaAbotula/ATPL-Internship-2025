<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrapping card layout</title>
    <style>
        .flex-container{
            display: flex;
            flex-wrap:wrap;
            border:none;
            border-radius: 3px;
            background-color: lightgray;
            justify-content: space-evenly;
            
        }
        .card{
             border:none;
            border-radius: 3px;
            background-color:whitesmoke;
            padding:20px;
            margin:10px;
            width:500px;
            height:auto;
            text-align: center;
        }
    </style>
</head>
<body>
    <center><h1>Wrapping card layout using flexbox</h1></center>
    <div class="flex-container">
        <div class="card">Card1</div>
        <div class="card">Card2</div>
        <div class="card">Card3</div>
        <div class="card">Card4</div>
        <div class="card">Card5</div>
        <div class="card">Card6</div>
    </div>
</body>
</html>
