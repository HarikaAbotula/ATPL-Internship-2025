<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <style>
        .grid-container{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            background-color: lightcyan;
            grid-gap:20px;
            border-radius: 10px;
            padding:20px;
            height:150px;
        }
        div{
            background-color: salmon;
            border-radius: 8px;
        }
        .div1{
            grid-column: 1/span 2;
        }
        p{
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <center><h1>4 column grid layout with 1 item spanning 2 columns </h1></center>
    <div class="grid-container">
        <div class="div1">
            <p>Div 1</p>
        </div>
        <div class="div2">
            <p>Div 2</p>
        </div>
        <div class="div3">
            <p>Div 3</p>
        </div>
        <div class="div4">
            <p>Div 4</p>
        </div>
        <div class="div5">
            <p>Div 5</p>
        </div>
    </div>
</body>
</html>
