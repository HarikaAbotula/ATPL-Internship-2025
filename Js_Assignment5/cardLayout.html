<!DOCTYPE html>
<html>

<head>
    <title>User Cards</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 70px;
        }

        .card {
            background-color: #dee1e6;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 10px 5px 19px rgba(214, 8, 8, 0.1);
            width: 200px;
            cursor: pointer;
        }

        .card h3 {
            margin: 0;
            color: rgb(0, 89, 255);
            text-align: center;
        }

        .card p {
            margin: 5px 0 0;
            color: rgb(5, 95, 155);
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container" id="cardContainer"></div>

    <script>
        const users = [
            { name: "Harika", age: 21 },
            { name: "Divya", age: 22 },
            { name: "Jerusha", age: 20 }
        ];

        const container = document.getElementById("cardContainer");

        users.forEach(user => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `<h3>${user.name}</h3><p>Age: ${user.age}</p>`;
            container.appendChild(card);
        });
    </script>

</body>

</html>
