<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <link rel="stylesheet" href="grades.css" />
</head>

<body>
    <div class="container">
        <h1>Grade Calculator</h1>
        <input type="number" id="sub1" placeholder="Enter Telugu marks" max="100" />
        <input type="number" id="sub2" placeholder="Enter Hindi marks" max="100" />
        <input type="number" id="sub3" placeholder="Enter English marks" max="100" />
        <input type="number" id="sub4" placeholder="Enter Social marks" max="100" />
        <input type="number" id="sub5" placeholder="Enter Science marks" max="100" />
        <input type="number" id="sub6" placeholder="Enter Maths marks" max="100" />

        <button onclick="calculateGrade()">Calculate Grade</button>
        <p id="result"></p>
    </div>
    <script src="grades.js"></script>
</body>

</html>
