<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even Odd Checker</title>
</head>

<body>
    <script>
        let num = prompt("Enter a positive number");
        if (num % 2 == 0) {
            alert("Number " + num + " is even number")
        }
        else {
            alert("Number " + num + " is odd number")
        }
    </script>
</body>

</html>
