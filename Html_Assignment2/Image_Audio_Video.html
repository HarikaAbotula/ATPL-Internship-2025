<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio,Video tags</title>
</head>
<body>
    <p> Image of Bird </p>
    <img src="bird.jpg" src="Bird"/>

    <p> Audio tag </p>
    <audio controls>
        <source src="retro-lounge-389644.mp3" type="audio/mpeg">
        Your browser does not support the audio tag.
    </audio>

    <p> Video Tag</p>
    <video width="320" height="240" controls>
       <source src="istockphoto-2163950243-640_adpp_is.mp4" type="video/mp4">
        Your browser does not support the video tag.
</video>
</body>
</html>
