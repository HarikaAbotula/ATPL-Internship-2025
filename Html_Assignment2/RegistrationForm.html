<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
   <h1>Student Registration Form</h1> 
   <p>Fill in this form to register</p>
   <form action="#">
   <label for="fname">First Name</label>
   <input type="text" id="fname" name="fname" placeholder="Enter your first name" required/><br><br>

   <label for="lname">Last Name</label>
   <input type="text" id="lname" name="lname" placeholder="Enter your last name" required/><br><br>

   <label for="email">E-mail</label>
   <input type="email" id="email" name="email" placeholder="Enter your e-mail" required /><br><br>

   <label for="dob">Date of Birth</label>
   <input type="date" id="dob" name="dob" required/><br><br>

   <label for="uname">Set Username</label>
   <input type="text" id="uname" name="uname" placeholder="Set Username" required/><br><br>

   <label for="pass">Set Password</label>
   <input type="password" id="pass" name="pass" placeholder="Set Password" required/><br><br>

    Gender <br>
    <input type="radio" name="gender"/>  Male 
   <br> <input type="radio" name="gender"/>Female 
    <br><input type="radio" name="gender"/>Others <br><br>

    <label for="course">Course</label>
    <select>
        <option value="courses">Course</option>
        <option value="HTML">HTML</option>
        <option value="CSS">CSS</option>
        <option value="Java script">Java script</option>
    </select> <br> <br>
    
    <label for="age">Age</label>
    <input type="number" id="age" name="age" min="18" max="100" required/><br><br>
    <button type="submit">Submit</button>
</form>
</body>
</html>
