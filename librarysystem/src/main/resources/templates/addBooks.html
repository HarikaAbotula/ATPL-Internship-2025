<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Book</title>
    <link rel="stylesheet" th:href="@{/css/addBooks.css}" />
</head>
<body>
<div class="container">
    <h2>Add Book</h2>
    <div th:if="${success}" style="background:#e6ffed;border:1px solid #95deab;color:#1e7e34;padding:10px;border-radius:6px;margin-bottom:12px;">
        [[${success}]]
    </div>
    <form th:action="@{/admin/books/add}" method="post">
        <label>Book ID (auto):</label>
        <input type="text" value="Auto-generated" disabled />

        <label for="title">Title:</label>
        <input id="title" type="text" name="title" placeholder="Title" required />

        <label for="author">Author:</label>
        <input id="author" type="text" name="author" placeholder="Author" />

        <label for="isbn">ISBN:</label>
        <input id="isbn" type="text" name="isbn" placeholder="ISBN" required />

        <button class="btn" type="submit">Add Book</button>
    </form>
    <a class="back-link" th:href="@{/admin/books}">Back to Dashboard</a>
</div>
</body>
</html>
