<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Issued Books</title>
    <link rel="stylesheet" th:href="@{/css/userIssuedBooks.css}" />
</head>
<body>
<nav class="navbar">
    <div class="nav-left">
        <a th:href="@{/user/dashboard}" style="font-weight:bold;">Library Dashboard - User</a>
        <a th:href="@{/user/issued}">IssuedBooks</a>
    </div>
    <div class="nav-center">Welcome, [[${session.username}]]</div>
    <div class="nav-right">
        <span>[[${session.username}]]([[${session.userNum}]])</span>
        <a th:href="@{/logout}" class="btn" style="margin-left:10px; padding:6px 10px; border-radius:4px; border:none; cursor:pointer; text-decoration:none; color:#fff; background:#6c757d;">Logout</a>
    </div>
</nav>

<div class="container">
    <div class="card">
        <h2>My Issued Books</h2>
        
        <table th:if="${issuedBooks != null and !issuedBooks.isEmpty()}">
            <tr>
                <th>Book ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Status</th>
            </tr>
            <tr th:each="ib : ${issuedBooks}">
                <td th:text="${ib.book.bookId}"></td>
                <td th:text="${ib.book.title}"></td>
                <td th:text="${ib.book.author}"></td>
                <td>
                    <span th:if="${ib.isReturned}" class="status-returned">Returned</span>
                    <span th:unless="${ib.isReturned}" class="status-issued">Issued</span>
                </td>
            </tr>
        </table>
        
        <div th:if="${issuedBooks == null or issuedBooks.isEmpty()}" style="text-align:center; padding:20px; color:#6c757d;">
            No books have been issued to you yet.
        </div>
    </div>
</div>

</body>
</html>
