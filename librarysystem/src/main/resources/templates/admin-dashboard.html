<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
  	<link rel="stylesheet" th:href="@{/css/admin-dashboard.css}" />
</head>
<body>
<nav class="navbar">
    <div class="nav-left">
        <a th:href="@{/admin/books}" style="font-weight:bold;">LibraryBookSystem</a>
        <a th:href="@{/admin/books/add}" target="_blank" style="margin-left:16px;">Add Books</a>
        <a th:href="@{/admin/issued}" style="margin-left:16px;">IssuedBooks</a>
    </div>
    <div class="nav-center"></div>
    <div class="nav-right">
        <span>Welcome, [[${session.username}]]</span>
        <a th:href="@{/logout}" class="btn">Logout</a>
    </div>
</nav>

<div class="card">
    <h2>Books</h2>
    <table>
        <tr>
            <th>ID</th><th>Title</th><th>Author</th><th>ISBN</th><th>Available</th><th>Actions</th>
        </tr>
        <tr th:each="book : ${books}">
            <td th:text="${book.bookId}"></td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.isbn}"></td>
            <td>
                <span th:text="${book.isAvailable} ? 'Yes' : 'No'" 
                      th:style="${book.isAvailable} ? 'color:#2ecc71;font-weight:bold;' : 'color:#e74c3c;font-weight:bold;'"></span>
            </td>
            <td class="actions">
                <a class="btn btn-edit" th:href="@{'/admin/books/edit/' + ${book.bookId}}">Edit</a>
                <a class="btn btn-delete" th:href="@{'/admin/books/delete/' + ${book.bookId}}" onclick="return confirm('Are you sure you want to delete this book?')">Delete</a>
                <a class="btn btn-issue" th:if="${book.isAvailable}" th:href="@{'/admin/books/issue/' + ${book.bookId}}">Issue</a>
                <a class="btn btn-return" th:if="${!book.isAvailable}" th:href="@{'/admin/books/return/' + ${book.bookId}}">Return</a>
            </td>
        </tr>
    </table>
</div>

</body>
</html>
