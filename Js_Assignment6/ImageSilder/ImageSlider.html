<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Image Slider</title>
    <link rel="stylesheet" href="ImageSlider.css" />
</head>

<body>

    <div class="slider" id="slider">
        <div class="slides" id="slides">
            <img src="https://tinypng.com/images/social/website.jpg" alt="1">
            <img src="https://tinypng.com/images/social/page-analyzer.jpg" alt="2">
            <img src="https://tinypng.com/images/social/developer-api.jpg" alt="3">
        </div>

        <!-- Previous and Next buttons -->
        <button class="control prev" id="prev">&#10094;</button>
        <button class="control next" id="next">&#10095;</button>

        <div class="dots" id="dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    <script src="ImageSlider.js"></script>

</body>

</html>
